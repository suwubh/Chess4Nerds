# Redis + nginx for the multi-replica WS benchmark. The actual WS replicas run
# natively on the host (see proof/README.md for commands) and nginx reverse-
# proxies to them via host.docker.internal.
#
#   docker compose -f proof/docker-compose.bench.yml up

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
